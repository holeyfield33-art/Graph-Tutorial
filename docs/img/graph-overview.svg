<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="The three-node release graph: Writer to Verifier to Gate, which emits PASS, BLOCK, or FREEZE.">
  <rect x="4" y="4" width="912" height="422" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#0f172a">The 3-node release graph</text>
  <text x="40" y="72" font-size="14" fill="#475569">Models propose. A deterministic script owns the release decision — the whole product idea in one picture.</text>

  <!-- trust boundary -->
  <line x1="597" y1="96" x2="597" y2="270" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="300" y="112" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">UNTRUSTED · model output</text>
  <text x="745" y="112" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">TRUSTED · deterministic</text>

  <!-- Writer -->
  <rect x="60" y="130" width="200" height="90" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="160" y="168" font-size="18" font-weight="700" fill="#1e3a8a" text-anchor="middle">Writer</text>
  <text x="160" y="192" font-size="12.5" fill="#3b5b96" text-anchor="middle">Agent — does the work</text>

  <!-- Verifier -->
  <rect x="340" y="130" width="200" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="440" y="168" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle">Verifier</text>
  <text x="440" y="192" font-size="12.5" fill="#a06517" text-anchor="middle">Agent — attacks the claims</text>

  <!-- Gate -->
  <rect x="645" y="130" width="200" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
  <text x="745" y="164" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Gate · gate.js</text>
  <text x="745" y="188" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">a script — NOT an LLM</text>
  <text x="745" y="206" font-size="11" fill="#64748b" text-anchor="middle">re-checks claims vs. disk</text>

  <!-- edges between nodes -->
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <line x1="260" y1="175" x2="333" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="296" y="167" font-size="10.5" fill="#64748b" text-anchor="middle">receipt +</text>
  <text x="296" y="204" font-size="10.5" fill="#64748b" text-anchor="middle">files</text>
  <line x1="540" y1="175" x2="638" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="589" y="167" font-size="10.5" fill="#64748b" text-anchor="middle">verifier</text>
  <text x="589" y="204" font-size="10.5" fill="#64748b" text-anchor="middle">receipt</text>

  <!-- distributor bus from Gate to three outcomes -->
  <line x1="745" y1="220" x2="745" y2="292" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="292" x2="745" y2="292" stroke="#94a3b8" stroke-width="2"/>
  <line x1="175" y1="292" x2="175" y2="326" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="292" x2="460" y2="326" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="745" y1="292" x2="745" y2="326" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- outcome pills -->
  <rect x="70" y="332" width="210" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="175" y="357" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">PASS · exit 0</text>
  <text x="175" y="376" font-size="11.5" fill="#15803d" text-anchor="middle">receipts valid, files exist</text>

  <rect x="355" y="332" width="210" height="56" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="460" y="357" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">BLOCK · exit 1</text>
  <text x="460" y="376" font-size="11.5" fill="#b45309" text-anchor="middle">rework — verifier FAIL</text>

  <rect x="640" y="332" width="210" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="745" y="357" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">FREEZE · exit 2</text>
  <text x="745" y="376" font-size="11.5" fill="#b91c1c" text-anchor="middle">hard stop — forbidden/missing</text>
</svg>
