<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="How the gate decides, top to bottom: the first failing check wins. Missing/invalid receipts, identity mismatch, forbidden paths, or files that do not exist on disk cause FREEZE; a FAIL status or an empty verifier causes BLOCK; otherwise PASS.">
  <rect x="4" y="4" width="892" height="652" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="36" y="44" font-size="22" font-weight="700" fill="#0f172a">How the gate decides</text>
  <text x="36" y="68" font-size="13.5" fill="#475569">Top to bottom, the first failing check wins. Every check reads receipts and the real filesystem — never the self-reported status alone.</text>

  <defs>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#d97706"/></marker>
  </defs>

  <!-- check rows -->
  <!-- A -->
  <rect x="60" y="92" width="420" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="80" y="123" font-size="14" fill="#1e293b">Both receipts present &amp; valid JSON?</text>
  <line x1="480" y1="118" x2="648" y2="118" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
  <text x="512" y="110" font-size="11" fill="#b91c1c">no →</text>
  <line x1="270" y1="144" x2="270" y2="172" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>

  <!-- B -->
  <rect x="60" y="172" width="420" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="80" y="203" font-size="14" fill="#1e293b">agent identity &amp; run_id match the run?</text>
  <line x1="480" y1="198" x2="648" y2="198" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
  <text x="512" y="190" font-size="11" fill="#b91c1c">no →</text>
  <line x1="270" y1="224" x2="270" y2="252" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>

  <!-- C -->
  <rect x="60" y="252" width="420" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="80" y="283" font-size="14" fill="#1e293b">No forbidden path, no ".." / absolute escape?</text>
  <line x1="480" y1="278" x2="648" y2="278" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
  <text x="512" y="270" font-size="11" fill="#b91c1c">no →</text>
  <line x1="270" y1="304" x2="270" y2="332" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>

  <!-- D (hardened) -->
  <rect x="60" y="332" width="420" height="58" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
  <text x="80" y="358" font-size="14" font-weight="700" fill="#14532d">Every claimed file exists &amp; is non-empty on disk?</text>
  <text x="80" y="378" font-size="11.5" fill="#15803d">★ the check that makes "don't trust the summary" real</text>
  <line x1="480" y1="361" x2="648" y2="361" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)"/>
  <text x="512" y="353" font-size="11" fill="#b91c1c">no →</text>
  <line x1="270" y1="390" x2="270" y2="418" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>

  <!-- E -->
  <rect x="60" y="418" width="420" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="80" y="449" font-size="14" fill="#1e293b">Writer &amp; Verifier status both PASS?</text>
  <line x1="480" y1="444" x2="648" y2="444" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="510" y="436" font-size="11" fill="#b45309">no →</text>
  <line x1="270" y1="470" x2="270" y2="498" stroke="#64748b" stroke-width="1.8" marker-end="url(#d)"/>

  <!-- F -->
  <rect x="60" y="498" width="420" height="52" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="80" y="529" font-size="14" fill="#1e293b">Verifier recorded real checks (not empty)?</text>
  <line x1="480" y1="524" x2="648" y2="524" stroke="#d97706" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="510" y="516" font-size="11" fill="#b45309">no →</text>
  <line x1="270" y1="550" x2="270" y2="580" stroke="#16a34a" stroke-width="2" marker-end="url(#d)"/>

  <!-- PASS -->
  <rect x="150" y="580" width="240" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.4"/>
  <text x="270" y="612" font-size="17" font-weight="700" fill="#166534" text-anchor="middle">PASS · exit 0</text>

  <!-- FREEZE off-ramp -->
  <rect x="648" y="212" width="200" height="60" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.4"/>
  <text x="748" y="240" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">FREEZE</text>
  <text x="748" y="259" font-size="11.5" fill="#b91c1c" text-anchor="middle">exit 2 · hard stop</text>
  <!-- collect the three upper red arrows visually toward the FREEZE box -->
  <line x1="648" y1="118" x2="700" y2="118" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="700" y1="118" x2="700" y2="212" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="648" y1="198" x2="700" y2="198" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="648" y1="278" x2="748" y2="278" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="748" y1="278" x2="748" y2="272" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="648" y1="361" x2="820" y2="361" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="820" y1="361" x2="820" y2="242" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="820" y1="242" x2="848" y2="242" stroke="#dc2626" stroke-width="1.8" marker-end="url(#r)" transform="translate(0,0)"/>

  <!-- BLOCK off-ramp -->
  <rect x="648" y="468" width="200" height="60" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
  <text x="748" y="496" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">BLOCK</text>
  <text x="748" y="515" font-size="11.5" fill="#b45309" text-anchor="middle">exit 1 · rework</text>
  <line x1="648" y1="444" x2="748" y2="444" stroke="#d97706" stroke-width="1.8"/>
  <line x1="748" y1="444" x2="748" y2="468" stroke="#d97706" stroke-width="1.8"/>
</svg>
